<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>Mister Download Manager</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="bar">
  <img src="icon.png" alt="" width="32" height="32">
  <div class="title">
    <strong>Mister Download Manager</strong>
    <span id="summary" class="muted"></span>
  </div>
  <button id="add-open" class="add-link" type="button" hidden>
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    <span data-t="Add Link"></span>
  </button>
  <button id="menu" class="icon" type="button" hidden aria-haspopup="true" aria-expanded="false" data-ta="More">&#8942;</button>
  <div id="menu-list" class="popup" role="menu" hidden>
    <button id="schedule-open" type="button" role="menuitem" data-t="Schedule download"></button>
    <button id="parallel-open" type="button" role="menuitem" data-t="Downloads at a time"></button>
    <button id="folder-open" type="button" role="menuitem" data-t="Download folder"></button>
    <button id="forget" type="button" role="menuitem" data-t="Forget this device"></button>
  </div>
</header>

<main>
  <section id="pair" class="card" hidden>
    <h1 id="auth-title"></h1>
    <p id="auth-text" class="muted"></p>
    <form id="auth-form">
      <label for="password" data-t="Password"></label>
      <input id="password" type="password" required maxlength="200" dir="ltr" autocomplete="current-password">
      <div id="confirm-row" hidden>
        <label for="password2" data-t="Password again"></label>
        <input id="password2" type="password" maxlength="200" dir="ltr" autocomplete="new-password">
      </div>
      <label for="name" data-t="This device's name"></label>
      <input id="name" name="name" maxlength="40" autocomplete="off">
      <p id="auth-error" class="error" role="alert"></p>
      <button id="auth-submit" class="primary" type="submit"></button>
    </form>
  </section>

  <section id="main" hidden>
    <div class="toolbar">
      <button id="all-btn" class="chip all-chip" type="button" hidden>
        <svg id="all-play" class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg id="all-stop" class="ico" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 6h12v12H6z"/></svg>
        <span id="all-label"></span>
      </button>
      <button id="limit-btn" class="chip limit-chip" type="button" aria-haspopup="dialog">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.27-10.44zM10.59 15.41a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z"/></svg>
        <span class="limit-text"><span class="limit-title" data-t="Speed limit"></span><strong id="limit-label"></strong></span>
      </button>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-filter="all" aria-selected="true" data-t="All"></button>
      <button type="button" role="tab" data-filter="active" aria-selected="false" data-t="Unfinished"></button>
      <button type="button" role="tab" data-filter="done" aria-selected="false" data-t="Finished"></button>
    </div>
    <ul id="list" class="list"></ul>
    <p id="empty" class="muted center" hidden data-t="No downloads here."></p>
  </section>

  <p id="offline" class="banner" role="status" hidden></p>
</main>

<dialog id="add-dialog" class="sheet" aria-labelledby="add-title">
  <form id="add" class="sheet-body" autocomplete="off">
    <h2 id="add-title" data-t="Add Link"></h2>
    <label for="url" data-t="Address or magnet link"></label>
    <div class="row url-row">
      <input id="url" type="url" inputmode="url" dir="ltr" placeholder="https://…   magnet:?…">
      <button id="paste" type="button" data-t="Paste"></button>
      <label class="button file" tabindex="0" role="button" data-ta="Choose a .torrent file">
        <span dir="auto" data-t=".torrent file"></span>
        <input id="file" type="file" accept=".torrent,application/x-bittorrent">
      </label>
    </div>
    <p id="file-name" class="muted" hidden></p>
    <div class="row">
      <label class="field"><span data-t="Category"></span><select id="category"></select></label>
    </div>
    <label class="check"><input id="later" type="checkbox"> <span data-t="Later download"></span></label>
    <div class="actions">
      <button type="button" id="add-close" data-t="Cancel"></button>
      <button class="primary" type="submit" data-t="Add"></button>
    </div>
  </form>
</dialog>

<dialog id="limit-dialog" class="sheet" aria-labelledby="limit-title">
  <div class="sheet-body">
    <h2 id="limit-title"></h2>
    <p id="limit-for" class="muted"></p>
    <div id="limit-presets" class="presets"></div>
    <label for="limit-kb" data-t="Your own limit (KB/sec)"></label>
    <div class="row">
      <input id="limit-kb" type="number" inputmode="numeric" min="1" max="10000000" step="1" dir="ltr" placeholder="800">
      <button id="limit-set" type="button" class="primary narrow" data-t="Set"></button>
    </div>
    <div class="actions">
      <button type="button" id="limit-close" data-t="Close"></button>
    </div>
  </div>
</dialog>

<dialog id="folder-dialog" class="sheet" aria-labelledby="folder-title">
  <div class="sheet-body">
    <h2 id="folder-title" data-t="Download folder"></h2>
    <p id="folder-intro" class="muted"></p>
    <label for="folder-path" data-t="Folder (a full path)"></label>
    <div class="row">
      <button id="folder-up" type="button" data-ta="Up one folder">&#8593;</button>
      <input id="folder-path" type="text" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="folder-go" type="button" data-t="Go"></button>
    </div>
    <ul id="folder-list" class="folders"></ul>
    <p id="folder-note" class="muted" hidden></p>
    <p class="muted" data-t="Choose a folder inside a volume you gave Docker (like /downloads), or the files are lost when the container is rebuilt."></p>
    <p id="folder-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="folder-close" data-t="Close"></button>
      <button type="button" id="folder-use" class="primary" data-t="Use this folder"></button>
    </div>
  </div>
</dialog>

<dialog id="parallel-dialog" class="sheet" aria-labelledby="parallel-title">
  <div class="sheet-body">
    <h2 id="parallel-title" data-t="Downloads at a time"></h2>
    <p class="muted" data-t="With 1, the next download starts when the one before it is done."></p>
    <div id="parallel-presets" class="presets four"></div>
    <div class="actions">
      <button type="button" id="parallel-close" data-t="Close"></button>
    </div>
  </div>
</dialog>

<dialog id="schedule-dialog" class="sheet" aria-labelledby="schedule-title">
  <div class="sheet-body">
    <h2 id="schedule-title" data-t="Schedule download"></h2>
    <p class="muted" data-t="Choose the date and time. Then tick the downloads that should start then."></p>
    <label for="sched-at" data-t="Start at"></label>
    <input id="sched-at" type="datetime-local">
    <p id="sched-error" class="error" role="alert"></p>
    <div class="actions">
      <button type="button" id="schedule-cancel" data-t="Cancel"></button>
      <button type="button" id="schedule-ok" class="primary" data-t="OK"></button>
    </div>
  </div>
</dialog>

<div id="pick-bar" class="pickbar" hidden>
  <span id="pick-text"></span>
  <button type="button" id="pick-cancel" data-t="Cancel"></button>
  <button type="button" id="pick-ok" class="primary" data-t="Schedule"></button>
</div>

<div id="toast" class="toast" popover="manual" role="status" aria-live="polite" hidden></div>

<dialog id="confirm">
  <form method="dialog">
    <p id="confirm-text"></p>
    <label class="check"><input id="confirm-file" type="checkbox"> <span data-t="Delete the file too"></span></label>
    <div class="actions">
      <button value="cancel" data-t="Cancel"></button>
      <button value="ok" class="primary danger" data-t="Remove"></button>
    </div>
  </form>
</dialog>

<template id="item">
  <li class="item">
    <div class="line top">
      <input class="pick" type="checkbox" data-ta="Select">
      <span class="name" dir="auto"></span>
      <span class="state"></span>
    </div>
    <div class="bar-track"><div class="bar-fill"></div></div>
    <div class="line details">
      <div class="stats">
        <span class="detail"></span>
        <span class="sched" hidden></span>
        <span class="speed-now"></span>
        <span class="eta" hidden>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
          <span class="eta-text"></span>
        </span>
        <span class="resume" hidden></span>
      </div>
      <span class="buttons">
        <button type="button" class="act limit">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.27-10.44zM10.59 15.41a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z"/></svg>
          <span class="lbl limit-name"></span>
        </button>
        <button type="button" class="act toggle">
          <svg class="ico play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="ico pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          <span class="lbl toggle-name"></span>
        </button>
        <button type="button" class="act remove">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          <span class="lbl remove-name"></span>
        </button>
      </span>
    </div>
    <p class="error-text error" hidden></p>
  </li>
</template>
</body>
</html>
