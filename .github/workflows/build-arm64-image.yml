name: Build arm64 image

on:
  push:
    paths:
      - ".github/workflows/build-arm64-image.yml"
      - "mdm-patch/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: My repo (the changes)
        uses: actions/checkout@v4
        with:
          path: patch

      - name: Upstream code
        uses: actions/checkout@v4
        with:
          repository: anefzaoui/misterdownloadmanager
          ref: 7b4766f5c7f00a5a50a33cdcbcce3271ce852ea3
          path: upstream

      - name: Add speed limit and the new page
        run: python3 patch/mdm-patch/apply.py upstream

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/misterdownloadmanager" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./upstream
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:latest
